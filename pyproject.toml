[project]
name = "goalquest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "chromadb>=0.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.2",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytest>=8.0",
    "redis>=5.0",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.29",
]

[tool.pytest.ini_options]
pythonpath = ["goalquest"]
testpaths = ["goalquest/tests"]

